<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>USFinWise CMS — Admin</title>

  <!--
  ═══════════════════════════════════════════════════════════
  NETLIFY IDENTITY WIDGET
  Required for git-gateway authentication.
  Provides the login/logout UI and JWT token management.
  ═══════════════════════════════════════════════════════════
  -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!--
  ═══════════════════════════════════════════════════════════
  DECAP CMS (formerly Netlify CMS)
  Loaded from jsDelivr CDN — always pin to a stable release.
  Current stable: 3.x
  ═══════════════════════════════════════════════════════════
  -->
  <link href="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.css" rel="stylesheet"/>
</head>
<body>
  <!--
  The CMS mounts itself into this div.
  No other body content is needed — Decap handles everything.
  -->
  <div id="nc-root"></div>

  <!-- Decap CMS core bundle — must load after the div exists -->
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!--
  ═══════════════════════════════════════════════════════════
  IDENTITY REDIRECT HANDLER
  After a successful Netlify Identity login/signup, the widget
  redirects back here. This listener completes the OAuth flow
  and grants the user CMS access.
  ═══════════════════════════════════════════════════════════
  -->
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', function (user) {
        if (!user) {
          window.netlifyIdentity.on('login', function () {
            // Redirect to the CMS editor after login
            document.location.href = '/admin/';
          });
        }
      });
    }
  </script>
</body>
</html>
