# ═══════════════════════════════════════════════════════
# DECAP CMS — USFinWise Complete Configuration
# يمكنك تعديل كل شيء في الموقع من هنا
# ═══════════════════════════════════════════════════════

backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: https://usfinwise.com
display_url: https://usfinwise.com

editor:
  preview: false

collections:

  # ═══════════════════════════════════════
  # 1. الإعدادات العامة للموقع
  # ═══════════════════════════════════════
  - name: "general"
    label: "🌐 General Site Settings"
    files:
      - name: "site_data"
        label: "⚙️ All Site Settings"
        file: "data/site_data.json"
        format: json
        fields:

          # ── SEO ──────────────────────────────
          - label: "🔍 SEO Settings"
            name: "seo"
            widget: "object"
            fields:
              - label: "Site Name"
                name: "site_name"
                widget: "string"
                default: "USFinWise"
                hint: "Appears in browser tab and Google results"

              - label: "Homepage Title Tag"
                name: "meta_title"
                widget: "string"
                default: "USFinWise — Free US Financial Calculators 2026"
                hint: "Max 60 characters for best Google display"

              - label: "Homepage Meta Description"
                name: "meta_description"
                widget: "text"
                default: "Free mortgage, 401k, auto loan, credit card & compound interest calculators. Updated for 2026. No sign-up required."
                hint: "Max 160 characters"

              - label: "Mortgage Page Description"
                name: "meta_desc_mortgage"
                widget: "text"
                default: "Free mortgage calculator 2026. Calculate PITI payment, PMI & amortization instantly."
                hint: "Max 160 characters"

              - label: "401k Page Description"
                name: "meta_desc_retirement"
                widget: "text"
                default: "Free 401k calculator 2026. Project your retirement savings with employer match & IRS limits."
                hint: "Max 160 characters"

              - label: "Auto Loan Page Description"
                name: "meta_desc_auto"
                widget: "text"
                default: "Free auto loan calculator 2026. True monthly payment with trade-in, tax & dealer fees."
                hint: "Max 160 characters"

              - label: "Credit Card Page Description"
                name: "meta_desc_cc"
                widget: "text"
                default: "Free credit card payoff calculator 2026. See your debt-free date instantly."
                hint: "Max 160 characters"

              - label: "Compound Interest Page Description"
                name: "meta_desc_ci"
                widget: "text"
                default: "Free compound interest calculator 2026. Visualize wealth growth over time."
                hint: "Max 160 characters"

              - label: "Canonical URL"
                name: "canonical_url"
                widget: "string"
                default: "https://usfinwise.com/"

              - label: "OG Image URL (Social Share Image)"
                name: "og_image"
                widget: "string"
                default: "https://usfinwise.com/images/og-image.png"
                hint: "Image shown when sharing on Facebook/Twitter. Size: 1200x630px"

              - label: "Twitter Handle"
                name: "twitter_handle"
                widget: "string"
                default: "@usfinwise"

          # ── LOGO & BRANDING ───────────────────
          - label: "🎨 Logo & Branding"
            name: "branding"
            widget: "object"
            fields:
              - label: "Site Name (Navbar)"
                name: "logo_text"
                widget: "string"
                default: "USFINWISE"
                hint: "Text shown next to the logo in the navbar"

              - label: "Logo US Prefix Color"
                name: "logo_us_color"
                widget: "string"
                default: "#1d4ed8"
                hint: "Color of 'US' in the logo. Use hex code e.g. #1d4ed8"

              - label: "Accent Color"
                name: "accent_color"
                widget: "string"
                default: "#3b82f6"
                hint: "Main blue color used throughout the site"

              - label: "Favicon URL"
                name: "favicon_url"
                widget: "string"
                default: "/images/favicon.ico"

          # ── HERO SECTION ──────────────────────
          - label: "🦸 Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - label: "Freshness Badge Text"
                name: "badge_text"
                widget: "string"
                default: "Updated for May 2026"
                hint: "The green badge at the top. Update monthly."

              - label: "Hero Heading Line 1"
                name: "heading_line1"
                widget: "string"
                default: "The Smartest Financial"

              - label: "Hero Heading Line 2"
                name: "heading_line2"
                widget: "string"
                default: "Calculators in America"

              - label: "Hero Subheading"
                name: "subheading"
                widget: "string"
                default: "Five precision tools for mortgages, retirement, auto loans & more — free, instant, 100% private."

              - label: "KPI — Monthly Users"
                name: "kpi_users"
                widget: "string"
                default: "500K+"

              - label: "KPI — Current 30yr Rate"
                name: "kpi_rate"
                widget: "string"
                default: "6.82%"
                hint: "Update weekly from Freddie Mac PMMS"

              - label: "KPI — Number of Calculators"
                name: "kpi_calculators"
                widget: "string"
                default: "5"

          # ── INTEREST RATES ────────────────────
          - label: "💰 Live Interest Rates"
            name: "rates"
            widget: "object"
            fields:
              - label: "Mortgage Rate (30-yr Fixed %)"
                name: "mortgage_rate"
                widget: "number"
                value_type: "float"
                min: 0.1
                max: 25.0
                step: 0.01
                default: 6.82
                hint: "National avg — update weekly from Freddie Mac"

              - label: "Auto Loan Rate (APR %)"
                name: "auto_loan_rate"
                widget: "number"
                value_type: "float"
                min: 0.1
                max: 30.0
                step: 0.01
                default: 7.10
                hint: "National avg new-car APR"

              - label: "Credit Card Rate (APR %)"
                name: "credit_card_rate"
                widget: "number"
                value_type: "float"
                min: 1.0
                max: 50.0
                step: 0.01
                default: 24.99
                hint: "Average US credit card APR"

              - label: "Savings / HYSA Rate (%)"
                name: "savings_rate"
                widget: "number"
                value_type: "float"
                min: 0.01
                max: 20.0
                step: 0.01
                default: 5.10

          # ── IRS LIMITS ────────────────────────
          - label: "🏛️ IRS & Regulatory Limits"
            name: "limits"
            widget: "object"
            fields:
              - label: "401k Employee Limit ($)"
                name: "k401_limit"
                widget: "number"
                value_type: "int"
                default: 23000
                hint: "Update every November when IRS announces new limits"

              - label: "401k Catch-Up Limit Age 50+ ($)"
                name: "k401_catchup"
                widget: "number"
                value_type: "int"
                default: 30500

              - label: "IRA Contribution Limit ($)"
                name: "ira_limit"
                widget: "number"
                value_type: "int"
                default: 7000

              - label: "HSA Limit — Individual ($)"
                name: "hsa_single"
                widget: "number"
                value_type: "int"
                default: 4300

              - label: "HSA Limit — Family ($)"
                name: "hsa_family"
                widget: "number"
                value_type: "int"
                default: 8550

              - label: "Conforming Loan Limit ($)"
                name: "conforming_limit"
                widget: "number"
                value_type: "int"
                default: 766550
                hint: "FHFA baseline for most US counties"

              - label: "FHA Loan Limit ($)"
                name: "fha_limit"
                widget: "number"
                value_type: "int"
                default: 498257

          # ── FOOTER ───────────────────────────
          - label: "🦶 Footer"
            name: "footer"
            widget: "object"
            fields:
              - label: "Footer Disclaimer Text"
                name: "disclaimer"
                widget: "text"
                default: "All results are estimates for educational purposes only. Not financial advice. Consult a licensed advisor before making financial decisions."

              - label: "Copyright Text"
                name: "copyright"
                widget: "string"
                default: "USFinWise Financial Tools. All rights reserved."

              - label: "GDPR/CCPA Notice"
                name: "cookie_notice"
                widget: "string"
                default: "We use essential cookies only. GDPR & CCPA compliant."

          # ── SOCIAL LINKS ─────────────────────
          - label: "📱 Social Media Links"
            name: "social"
            widget: "object"
            fields:
              - label: "Twitter / X URL"
                name: "twitter"
                widget: "string"
                default: "https://twitter.com/usfinwise"

              - label: "LinkedIn URL"
                name: "linkedin"
                widget: "string"
                default: "https://linkedin.com/company/usfinwise"

              - label: "Facebook URL"
                name: "facebook"
                widget: "string"
                default: "https://facebook.com/usfinwise"

              - label: "Contact Email"
                name: "email"
                widget: "string"
                default: "hello@usfinwise.com"

          # ── DISPLAY ──────────────────────────
          - label: "📝 Display Settings"
            name: "display"
            widget: "object"
            fields:
              - label: "Freshness Badge Text"
                name: "last_updated_text"
                widget: "string"
                default: "Updated for May 2026"

              - label: "KPI Users Display"
                name: "kpi_users"
                widget: "string"
                default: "500K+"

              - label: "KPI Rate Display"
                name: "kpi_rate_display"
                widget: "string"
                default: "6.82%"

  # ═══════════════════════════════════════
  # 2. مقالات SEO
  # ═══════════════════════════════════════
  - name: "articles"
    label: "📰 SEO Articles"
    description: "Edit the expert articles shown below each calculator"
    folder: "data/articles"
    create: true
    format: json
    slug: "{{slug}}"
    fields:
      - label: "Calculator Tool"
        name: "tool"
        widget: "select"
        options:
          - { label: "Mortgage", value: "mortgage" }
          - { label: "401k / Retirement", value: "ret" }
          - { label: "Auto Loan", value: "auto" }
          - { label: "Credit Card", value: "cc" }
          - { label: "Compound Interest", value: "ci" }

      - label: "Article Title"
        name: "title"
        widget: "string"
        hint: "Include year (2026) for freshness. Max 70 chars."

      - label: "Tag Label"
        name: "tag"
        widget: "string"
        default: "Expert Guide"

      - label: "Article Body"
        name: "body"
        widget: "markdown"
        hint: "Target 600-900 words. Use ## for subheadings."

  # ═══════════════════════════════════════
  # 3. الصفحات القانونية
  # ═══════════════════════════════════════
  - name: "legal"
    label: "⚖️ Legal Pages"
    description: "Edit Privacy Policy, Terms of Service, and Disclaimer"
    files:
      - name: "privacy"
        label: "🔒 Privacy Policy"
        file: "data/legal/privacy.json"
        format: json
        fields:
          - label: "Last Updated"
            name: "last_updated"
            widget: "string"
            default: "May 1, 2026"
          - label: "Content"
            name: "content"
            widget: "markdown"

      - name: "terms"
        label: "📋 Terms of Service"
        file: "data/legal/terms.json"
        format: json
        fields:
          - label: "Last Updated"
            name: "last_updated"
            widget: "string"
            default: "May 1, 2026"
          - label: "Content"
            name: "content"
            widget: "markdown"

      - name: "disclaimer"
        label: "⚠️ Financial Disclaimer"
        file: "data/legal/disclaimer.json"
        format: json
        fields:
          - label: "Last Updated"
            name: "last_updated"
            widget: "string"
            default: "May 1, 2026"
          - label: "Content"
            name: "content"
            widget: "markdown"
